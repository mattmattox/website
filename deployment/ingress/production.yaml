---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  labels:
    app: supporttools
  name: lb
spec:
  rules:
  - host: prod.support.tools
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: www
            port:
              number: 8080
  - host: www.support.tools
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: www
            port:
              number: 8080
  - host: support.tools
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: www
            port:
              number: 8080
  tls:
  - hosts:
    - prod.support.tools
    - www.support.tools
    - support.tools
    secretName: star-support-tools