apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  labels:
    app: supporttools
  name: lb
spec:
  rules:
  - host: master-BUILD_NUMBER.support.tools
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: www
            port:
              number: 8080
  tls:
  - hosts:
    - master-BUILD_NUMBER.support.tools
    secretName: star-support-tools
